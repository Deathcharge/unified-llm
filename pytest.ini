[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    provider: test specific LLM provider
    client: test client functionality
    engine: test engine functionality
    optimization: test optimization features
    integration: test integration scenarios
    performance: test performance
    async: test async functionality
