[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-llm"
version = "0.1.0"
description = "A small, bounded async router for OpenAI-compatible LLM endpoints"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Samsarix LLC", email = "contact@samsarix.com" },
]
maintainers = [
  { name = "Samsarix LLC", email = "support@samsarix.com" },
]
license-files = ["LICENSE", "LICENSE.PROPRIETARY"]
dependencies = [
  "httpx>=0.27,<1",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
keywords = ["llm", "routing", "openai-compatible", "fallback"]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "twine>=6,<7",
]

[project.urls]
Repository = "https://github.com/Deathcharge/unified-llm"
Issues = "https://github.com/Deathcharge/unified-llm/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["unified_llm*"]

[tool.setuptools.package-data]
unified_llm = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["unified_llm"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
