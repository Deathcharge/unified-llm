[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-proprietary-llm"
version = "1.0.0"
description = "Local LLM inference, training, and quantization engine for Helix"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.10"
authors = [{ name = "Helix Collective" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.100",
    "torch>=2.0",
    "llama-cpp-python>=0.3.0",
    "huggingface-hub>=0.21.0",
    "aiohttp>=3.9",
    "psutil>=5.9",
    "numpy>=1.24",
    "redis>=5.0",
]

[project.optional-dependencies]
training = ["adafactor", "bitsandbytes"]
all = ["helix-proprietary-llm[training]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["proprietary_llm*"]
